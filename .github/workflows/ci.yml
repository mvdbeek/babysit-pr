name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: uv run --locked tox -e lint,format,types,skill,frontend

  tests:
    name: Unit, browser and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install Chromium system dependencies
        run: uv run --locked playwright install-deps chromium
      - run: uv run --locked tox -e unit,browser,coverage
      # Coverage (reports/coverage, reports/coverage.xml) and failed browser screenshots.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore

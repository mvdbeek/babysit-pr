[tox]
env_list = lint, format, types, skill, frontend, unit, browser, coverage

[testenv]
runner = uv-venv-lock-runner
dependency_groups = dev
uv_sync_locked = true
package = skip

[testenv:lint]
description = Python lint and shell syntax
allowlist_externals = zsh
commands =
    ruff check scripts tests
    zsh -n scripts/claude_safehouse.zsh

[testenv:format]
description = Check Python formatting
commands = ruff format --check scripts tests

[testenv:types]
description = Check all Python runtime and development script bodies
commands = mypy

[testenv:skill]
description = Validate the skill without external skill tooling
commands = python scripts/validate_skill.py

[testenv:frontend]
description = Locked Node tools, JavaScript lint, formatting, and interaction tests
allowlist_externals = npm
commands =
    npm ci --no-audit --no-fund
    npm run lint
    npm run format:check
    npm test

[testenv:unit]
description = Python unit and process integration tests with branch/subprocess coverage
set_env = COVERAGE_FILE = {toxworkdir}/coverage/.coverage.unit
commands = pytest -m "not browser" --cov --cov-report= --cov-fail-under=0 -q {posargs}

[testenv:browser]
description = Real Chromium against an isolated dashboard and queue
set_env = COVERAGE_FILE = {toxworkdir}/coverage/.coverage.browser
commands =
    playwright install chromium
    pytest -m browser --cov --cov-report= --cov-fail-under=0 --screenshot only-on-failure --output reports/browser -q {posargs}

[testenv:coverage]
description = Combine Python branch/subprocess coverage and enforce the baseline
depends = unit, browser
commands =
    coverage combine --keep {toxworkdir}/coverage
    coverage report
    coverage html
    coverage xml

[testenv:fix]
description = Apply formatting and safe lint fixes (not part of the check suite)
allowlist_externals = npm
commands =
    ruff check --fix scripts tests
    ruff format scripts tests
    npm ci --no-audit --no-fund
    npm run format
